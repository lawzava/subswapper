name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: install golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - name: install govulncheck
        if: runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - name: full Go gate
        run: go run ./internal/tools/check -tier=full -scope=go -ci

  paseo-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install
        working-directory: paseo-plugin
        run: npm ci --no-audit --no-fund
      - name: install OpenCode plugin dependencies
        working-directory: plugins/opencode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: full plugin gate
        run: go run ./internal/tools/check -tier=full -scope=plugin -ci
